# Nightly oilgas ETL on GitHub Actions (moved scripts.run_daily off the laptop).
#
# ROLLOUT (see docs/cold_start.md §6):
#   Phase 1 (2026-07-08): manual trigger + read-only preflight. DONE.
#   Phase 2 (2026-07-08): manual `python -m scripts.run_daily`. DONE — first
#                         attempts hit the pre-hardening Supabase restart
#                         window; upsert_batch_resilient / Enverus timeouts /
#                         the gated production_forecast refresh landed after.
#   Phase 3 (2026-07-21): `schedule:` cron live; the laptop Task Scheduler
#                         task (`engineering_db_daily_etl`) was DISABLED in
#                         the same change so they never both run against prod.
#
#   Phase 4 (2026-11-02): fixed-hour trigger. The GitHub cron never fired on
#                         time (see below), so an external scheduler now
#                         dispatches the run and the cron became a guarded
#                         backstop.
#
# Schedule (two triggers, one nightly):
#   PRIMARY  - cron-job.org (always-on, NOT the laptop) POSTs the REST
#              workflow_dispatch endpoint daily at 05:00 America/Chicago (it
#              follows DST, so 05:00 CT all year = 11:00 UTC in CST, 10:00 UTC
#              in CDT) with only_if_needed=true and a fine-grained PAT
#              (Actions read/write, this repo only). Dispatch starts in seconds.
#   BACKSTOP - the `schedule:` cron below. GitHub's scheduler is best-effort:
#              the old 11:15 UTC slot fired 2.6-9.5 h late on the last 60 nights
#              (median 4.6 h, i.e. ~10:00 CT, drifting to 16:00-17:30 UTC in
#              October and 20:47 UTC on 2026-11-02), straight into the daytime
#              BOX builds. It stays only to cover a primary that never fired
#              (cron-job.org outage, expired PAT).
#   The `gate` job makes the backstop safe: a guarded trigger (the cron, or a
#   dispatch with only_if_needed=true) exits cleanly, without touching the DB,
#   when an `etl` job already SUCCEEDED in a run created since the most recent
#   09:00 UTC (03:00 CST / 04:00 CDT, before the primary in both seasons). A
#   failed primary does not count, so the backstop retries it. A plain manual
#   "Run workflow" (only_if_needed off) is never gated.
# Vendor timing (measured 2026-11-02): the Novi bulk ExportDate lands anywhere
# 02:00-16:00 UTC (median ~10:30 UTC), so no pre-workday hour always catches the
# same-day export. Missing it loses nothing: the runner downloads the latest
# full export, and the next night picks up the newer one. The Enverus batch
# stamps updateddate ~04:30-06:30, and the incremental cursor is day-granular
# (`updateddate=gt(<date of last success>)`), so a run that starts before the
# batch picks it up the next night. The hour is therefore set by the workday:
# p90 run 88 min, slowest 160 min, so a 05:00 CT start is done by ~06:30 CT on
# 9 nights in 10 and by ~07:40 CT on the worst night.
#
# Connectivity: DB_HOST is the Supabase SESSION POOLER (IPv4, port 5432) - the
# direct db.<ref>.supabase.co endpoint is IPv6-only and unreachable from Actions
# runners. etl/db.py already sets TCP keepalives + `SET statement_timeout=0` per
# session, so curated refreshes survive the pooler.
#
# Timeout: a normal night is ~15 min; a new Novi forecast vintage adds the
# curated.production_forecast refresh (~45 min observed 2026-07-14/21), and a
# fresh runner always does the full ~1.6 GB Novi bulk download. 180 min covers
# all of that with margin while still killing a genuinely wedged run.
name: etl-nightly

on:
  workflow_dispatch:      # primary (cron-job.org) + manual re-run / catch-up
    inputs:
      only_if_needed:
        description: >-
          Skip if an ETL already succeeded since 09:00 UTC today (the external
          scheduler sets this; leave it off for a manual catch-up)
        type: boolean
        default: false
  schedule:
    - cron: "15 11 * * *"   # BACKSTOP only; gated, see header

# Least privilege: talks to Supabase, needs no write access to the repo.
# actions: read lets the gate list this workflow's earlier runs.
permissions:
  contents: read
  actions: read

# Never let two ETL runs overlap against prod.
concurrency:
  group: etl-nightly
  cancel-in-progress: false

jobs:
  # Dedupe guard (see header). Read-only GitHub API calls, no DB access.
  # The logic lives in scripts/etl_gate.py (stdlib only, unit-tested in
  # tests/test_etl_gate.py). It filters the UNFILTERED runs listing itself:
  # the API's status= filter silently dropped the 2026-11-04 primary run, so
  # the backstop re-ran the full ETL that afternoon.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/etl_gate.py
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          GUARDED: ${{ github.event_name == 'schedule' || github.event.inputs.only_if_needed == 'true' }}
        run: python3 scripts/etl_gate.py

  etl:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: "5432"
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: require
      # Ride out a managed-Postgres restart/failover (Supabase "terminating
      # connection due to administrator command" can take a few minutes): more
      # attempts, longer cap than the etl/db.py defaults (6 / 30s).
      DB_CONNECT_RETRIES: "12"
      DB_CONNECT_RETRY_MAX: "60"
      ENVERUS_SECRET_KEY: ${{ secrets.ENVERUS_SECRET_KEY }}
      NOVI_EMAIL: ${{ secrets.NOVI_EMAIL }}
      NOVI_PASSWORD: ${{ secrets.NOVI_PASSWORD }}
      NOVI_SCOPE: ${{ secrets.NOVI_SCOPE }}
      NOVI_VERSION: ${{ secrets.NOVI_VERSION }}
      # Novi INTEL Snowflake share — read-only new-report check
      # (etl/intel_sf/detect.py; step fails without these).
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
      NOTIFY_SMTP_HOST: ${{ secrets.NOTIFY_SMTP_HOST }}
      NOTIFY_SMTP_PORT: ${{ secrets.NOTIFY_SMTP_PORT }}
      NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER }}
      NOTIFY_SMTP_PASS: ${{ secrets.NOTIFY_SMTP_PASS }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # Read-only preflight: confirms the runner can reach Supabase with the
      # configured secrets before any write happens. Cheap, and separates
      # "secrets/connectivity broke" from "the ETL itself broke" at a glance.
      - name: Preflight (read-only connectivity)
        run: |
          python - <<'PY'
          from etl.db import get_connection
          conn = get_connection()
          cur = conn.cursor()
          cur.execute("select max(run_finished_at) from meta.etl_log")
          print("meta.etl_log latest run:", cur.fetchone()[0])
          cur.execute("select count(*) from curated.wells")
          print("curated.wells rows:", cur.fetchone()[0])
          conn.close()
          print("PREFLIGHT OK")
          PY

      # The real nightly ETL. Writes to prod (raw_novi, raw_enverus, curated,
      # advances meta.etl_log). run_daily isolates each step in its own
      # try/except and emails a summary + pings healthchecks at the end.
      - name: Run daily ETL
        run: python -m scripts.run_daily

      # The dated run log, kept even (especially) on failure. The email
      # summary covers the happy path; this is the full trace for debugging.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-daily-log
          path: logs/*.log
          retention-days: 30
          if-no-files-found: ignore
